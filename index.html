<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UNITE.SCHOOLGAMES — Countdown</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      background: #000;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: "Anton", Impact, sans-serif;
    }

    .page {
      width: min(1200px, 92vw);
      text-align: center;
      animation: fadeIn 1s ease-out;
    }

    .logo {
      width: min(850px, 88vw);
      height: auto;
      display: block;
      margin: 0 auto 45px;
      object-fit: contain;
    }

    .eyebrow {
      font-size: clamp(18px, 2.2vw, 30px);
      letter-spacing: 6px;
      margin-bottom: 12px;
    }

    .countdown {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: clamp(12px, 3.5vw, 42px);
      margin: 0 auto 42px;
    }

    .unit {
      min-width: clamp(62px, 9vw, 125px);
    }

    .number {
      font-size: clamp(54px, 8.5vw, 112px);
      line-height: .9;
      letter-spacing: 1px;
    }

    .label {
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(9px, 1vw, 13px);
      font-weight: 700;
      letter-spacing: 3px;
      margin-top: 12px;
      opacity: .65;
    }

    .release {
      font-size: clamp(25px, 4vw, 52px);
      letter-spacing: 3px;
      line-height: 1;
      margin-bottom: 12px;
    }

    .date {
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(12px, 1.5vw, 18px);
      letter-spacing: 4px;
      opacity: .6;
    }

    .live {
      animation: pulse 1s infinite;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(.97); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .45; }
    }

    @media (max-width: 600px) {
      .logo {
        margin-bottom: 35px;
      }

      .countdown {
        gap: 8px;
        margin-bottom: 32px;
      }

      .unit {
        min-width: 55px;
      }

      .label {
        letter-spacing: 2px;
      }
    }
  </style>
</head>

  <script>
    // September 26, 2026 at 7:00 PM Egypt time (UTC+3)
    const releaseDate = new Date("2026-09-26T19:00:00+03:00");

    const daysEl = document.getElementById("days");
    const hoursEl = document.getElementById("hours");
    const minutesEl = document.getElementById("minutes");
    const secondsEl = document.getElementById("seconds");
    const releaseText = document.getElementById("releaseText");

    function pad(value) {
      return String(value).padStart(2, "0");
    }

    function updateCountdown() {
      const now = new Date();
      const difference = releaseDate.getTime() - now.getTime();

      if (difference <= 0) {
        daysEl.textContent = "00";
        hoursEl.textContent = "00";
        minutesEl.textContent = "00";
        secondsEl.textContent = "00";

        releaseText.textContent = "UNITE.SCHOOLGAMES IS LIVE";
        releaseText.classList.add("live");
        return;
      }

      const totalSeconds = Math.floor(difference / 1000);

      const days = Math.floor(totalSeconds / 86400);
      const hours = Math.floor((totalSeconds % 86400) / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      daysEl.textContent = pad(days);
      hoursEl.textContent = pad(hours);
      minutesEl.textContent = pad(minutes);
      secondsEl.textContent = pad(seconds);
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>
